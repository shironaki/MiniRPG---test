name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check all game scripts
        run: for f in js/*.js scripts/*.js tests/*.js; do node --check "$f"; done
      - name: Run unit tests
        run: npm test
